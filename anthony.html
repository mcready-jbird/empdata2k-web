  else poly([x-3,y-15, x+3,y-15, x+5,y, x-5,y], function(px){ return (px-x)%3===0 ? '1' : '2'; });
  var hy = o.kneel ? y-15 : o.sit ? y-17 : y-18;
  P(x-f*2,hy+6,'B'); P(x-f*2,hy+7,'B'); P(x-f*3,hy+6,'B'); P(x-f,hy+6,'B');       // the tau on his cloak
  ell(x,hy,2.4,2.8,'f'); P(x,hy-2,'F'); rect(x-1,hy+2,3,3,'8'); P(x,hy+5,'8');       // bald head, white beard
  P(x+f,hy-1,'2');

}

  poly([72,102, 76,102, 78,144, 70,146], function(px,py){ return (px+py)%4===0 ? 'R' : 'r'; });
  demon(64,146,1,{c:'d',d:'D',kind:'horn'}); line(67,140,72,132,'d');
  // the saint sits reading; bread and wine on a table the devils set before him
  saint(38,200,1,{sit:true,book:true});
  rect(58,186,30,2,'9'); rect(58,188,30,1,'7'); ell(64,184,2.5,1.5,'t'); rect(72,180,3,6,'S'); P(73,179,'S'); ell(81,184,2,1.2,'r');
  nude(66,198,0,1,'f','h'); rect(64,190,8,1,'F'); line(60,188,60,198,'n'); line(86,188,86,198,'n');
  // little grotesques about
  demon(94,206,-1,{c:'4',d:'5',kind:'bird'}); poly([91,196, 97,196, 94,191],'4');
  demon(20,222,1,{c:'N',d:'n',kind:'rat'}); egg(50,226,5,3,['P','p','k']); P(55,225,'P'); rect(47,229,1,2,'P'); rect(52,229,1,2,'P');
  demon(80,230,-1,{c:'i',d:'I',kind:'fish'});
  speck(R,0,108,W,130,50,'yk9');
}

/* ===================== THE ARREST · THE WAY TO CALVARY ===================== */
// shut: two scenes in grisaille, the soldiers take christ in the garden (left) and lead
// him away with the cross (right)
// the crowds are placed by hand, back to front; [x, feet y, dir, options]
var ARREST=[
  [16,146,1,{}], [30,142,1,{arm:'torch'}], [80,140,-1,{arm:'torch'}], [94,146,-1,{}],
  [24,164,1,{shield:true}], [40,160,1,{}], [72,160,-1,{shield:true}], [88,166,-1,{}],
  [45,180,1,{arm:'grab'}], [67,180,-1,{arm:'grab'}],
  [12,194,1,{}], [98,196,-1,{arm:'torch'}]
];
var CALVARY=[
  [14,140,1,{}], [34,136,1,{arm:'torch'}], [82,138,-1,{}], [100,144,-1,{arm:'torch'}],
  [20,166,1,{shield:true}], [94,170,-1,{shield:true}],
  [12,208,1,{}], [100,212,-1,{}]
];
function paintPassion(){
  var R=RNG(54), W=DOORS.w, ox=W/2, i;
  rect(0,0,W,DOORS.h, function(x,y){ return rampInk(['#','J','U','Q'], 0.22+0.3*fbm(x*0.04,y*0.04)+(y>130?0.18:0)); });
  // left: the garden of gethsemane at night, the moon, dark trees, the soldiers seize christ
  ball(26,28,6,['Q','O','L']);
  for (var tr=0;tr<6;tr++) ball(8+tr*19,76+(tr%2)*6,9,['#','J','U']);
  for (i=0;i<10;i++){ var g=ARREST[i]; trooper(g[0],g[1],g[2],g[3]); }
  bigRobe(56,184,1,'O','Q',{sk:'L',hair:'Q',halo:'L'});
  for (i=10;i<ARREST.length;i++){ var g2=ARREST[i]; trooper(g2[0],g2[1],g2[2],g2[3]); }
  // below, peter swings his sword at malchus, who lies with his lantern
  bigRobe(32,226,1,'Q','U',{sk:'O',hair:'L',halo:'O',sword:true});
  limb(44,224,60,226,2,'U'); ell(42,223,2,2,'O'); rect(62,222,3,4,'L'); P(63,221,'O');
  // right: a town on the hill, christ bowed under the cross, simon of cyrene helping,
  // veronica showing the veil with his face
  for (var h=0;h<4;h++) poly([ox+8+h*26,94, ox+21+h*26,72, ox+34+h*26,94],'J');
  rect(ox+62,40,22,54,'U'); for (var t=0;t<4;t++) rect(ox+63+t*6,34,3,6,'U'); rect(ox+70,70,4,8,'#');
  for (i=0;i<4;i++){ var c=CALVARY[i]; trooper(c[0]+ox,c[1],c[2],c[3]); }
  limb(ox+18,150,ox+100,200,2.6,'Q'); line(ox+18,148,ox+100,198,'L'); limb(ox+64,156,ox+54,186,2.2,'Q');
  bigRobe(ox+60,202,1,'O','Q',{sk:'L',hair:'Q',halo:'L'});
  robed(ox+80,202,-1,{c:'Q',d:'U',sk:'O',hair:'U',pose:1});
  for (i=4;i<CALVARY.length;i++){ var c2=CALVARY[i]; trooper(c2[0]+ox,c2[1],c2[2],c2[3]); }
  robed(ox+34,226,1,{c:'O',d:'Q',sk:'L',hat:'hood',hc:'Q',pose:3}); rect(ox+38,214,7,6,'L'); ell(ox+41,217,1.5,1.8,'O'); P(ox+41,216,'J');
  line(ox+28,190,ox+50,186,'O'); line(ox+82,184,ox+72,196,'O');
}

/* ========================= moving things ========================== */
// left: devils carry the saint through the air and beat him; a bird skates on the ice
var FLIGHT=[0,1].map(function(fr){ return mkSpr(34,20,function(){
  egg(17,12,10,4.5,['N','n','t']); ell(26,11,4,3,'n'); P(28,10,'y'); P(29,12,'R');
  if (fr){ poly([12,9, 6,1, 16,6],'2'); poly([20,9, 24,0, 26,7],'2'); } else { poly([12,10, 4,14, 14,12],'2'); poly([20,10, 28,16, 24,11],'2'); }
  path([7,12, 3,10, 1,13],'n');
  rect(12,5,9,3,'2'); ell(22,6,2,1.8,'f'); rect(22,7,2,1,'8'); P(14,5,'B');
}); });
var BATS=[0,1].map(function(fr){ return mkSpr(12,12,function(){ demon(4,10,1,{c:'i',d:'I',kind:'horn'}); if (fr) path([3,5, 0,1, 1,5],'I'); else path([3,5, 0,7, 2,8],'I'); line(6,4,9,0,'N'); }); });
function drawFlight(){
  var t=tick*0.012, cx=PL.x+50+Math.cos(t)*26, cy=PL.y+40+Math.sin(t*1.3)*14, fr=(tick>>2)&1;
  dspr(FLIGHT[fr], cx-17, cy-10, Math.sin(t)>0);
  for (var i=0;i<3;i++){ var a=tick*0.06+i*2.1; dspr(BATS[(fr+i)&1], cx-6+Math.cos(a)*20, cy-8+Math.sin(a)*10, Math.cos(a)>0); }
}
var SKATER=mkSpr(12,14,function(){ egg(6,7,3.4,3,['4','5','6']); ball(8,4,2,['4','5','6']); line(10,4,12,5,'S'); poly([6,2, 10,2, 8,-2],'5'); poly([5,3, 11,3, 8,0],'6'); rect(3,10,1,2,'S'); rect(8,10,1,2,'S'); line(1,12,11,12,'7'); rect(4,6,2,2,'9'); });
var skate={x:10,v:0.4};
function drawSkate(){ skate.x+=skate.v; if (skate.x>90||skate.x<4) skate.v=-skate.v; dspr(SKATER, PL.x+skate.x, PL.y+ICE.y0+10, skate.v<0); }
// centre: the village burns, smoke rolls, a devil ship sails the sky, the fish boat rocks
var villageFire=makeFire(PC,[[10,98,1.3],[26,97,1.5],[42,98,1.3],[58,96,1.6],[74,98,1.2],[88,99,1.1],[62,70,0.9]],6);
var villageSmoke=makeSmoke(PC,[[20,80],[40,78],[60,62],[80,84]],0.7,0.2);
var SHIP=[0,1].map(function(fr){ return mkSpr(30,20,function(){ egg(14,14,11,3.5,['x','w','W']); P(24,13,'0'); P(26,15,'R'); poly([3,14, -1,10, -1,18],'w'); line(14,11,14,1,'N'); poly([15,2, 15,10, 22,9],fr?'9':'8'); demon(8,12,1,{c:'i',d:'I',kind:'bird'}); }); });
function drawShip(){ var span=PC.iw+40, x=((tick*0.3)%span)-30, y=20+Math.round(4*Math.sin(tick*0.04)); var sp=SHIP[(tick>>3)&1]; for (var q=0;q<sp.p.length;q+=3){ var px=x+sp.p[q]; if (px<0||px>=PC.iw) continue; dp(PC.x+px, PC.y+y+sp.p[q+1], sp.p[q+2]); } }
var lute=makeNotes(PC,[[96,180]],18);
var ripples=[]; for (var rq=0;rq<18;rq++) ripples.push({x:4+Math.random()*206, y:200+Math.random()*36, ph:Math.random()*6});
function drawWater(){
  for (var i=0;i<ripples.length;i++){ var r=ripples[i], b=Math.sin(tick*0.08+r.ph); if (b<0.4) continue; dglyph((PC.y+r.y)>>1, PC.x+Math.round(r.x+b*2), '~', b>0.8?K.W:K.w); }
  var bob=(tick>>4)&1; dp(PC.x+36,PC.y+206-bob,K.I); dp(PC.x+48,PC.y+206-(1-bob),K.I);
}
// right: a fish flies over, little devils carry food to the table
var FISH=[0,1].map(function(fr){ return mkSpr(26,12,function(){ egg(12,6,9,3,['x','w','W']); P(19,5,'0'); P(21,7,'R'); poly([4,6, 0,2, 0,10],'w'); if (fr) poly([10,4, 14,0, 16,4],'W'); else poly([10,7, 14,11, 16,7],'W'); demon(9,5,1,{c:'i',d:'I',kind:'horn'}); }); });
function drawFishFly(){ var span=PR.iw+30, x=span-((tick*0.35)%span)-24, y=24+Math.round(5*Math.sin(tick*0.05)); var sp=FISH[(tick>>3)&1]; for (var q=0;q<sp.p.length;q+=3){ var px=x+(sp.w-1-sp.p[q]); if (px<0||px>=PR.iw) continue; dp(PR.x+px, PR.y+y+sp.p[q+1], sp.p[q+2]); } }
var WAITER=[0,1].map(function(fr){ return mkSpr(8,14,function(){ demon(2,13,1,{c:'i',d:'I',kind:fr?'bird':'horn'}); rect(3,1,3,2,'t'); line(4,3,4,5,'I'); }); });
function drawWaiters(){
  for (var i=0;i<2;i++){ var t=((tick*0.006+i*0.5)%1), x=100-t*28, y=214-t*14; dspr(WAITER[((tick>>2)+i)&1], PR.x+x, PR.y+y-13, true); }
}
// shut: the torches flicker
function drawClosedA(){
  var ox=PC.c0, oy=TOP*2, list=[];
  ARREST.forEach(function(g){ if (g[3].arm==='torch') list.push(torchFlame(g[0],g[2],g[1])); });
  CALVARY.forEach(function(g){ if (g[3].arm==='torch'){ var fl=torchFlame(g[0],g[2],g[1]); list.push([fl[0]+DOORS.w/2,fl[1]]); } });
  for (var i=0;i<list.length;i++){ var fl=Math.random(); dglyph((oy+list[i][1]-(fl<0.5?2:1))>>1, ox+list[i][0], fl<0.3?'▓':fl<0.7?'▒':'░', fl<0.5?K['9']:K.L); }
}

/* ============================== start ============================= */
triptychStart({
  id:2,
  paint:{ L:paintFlight, C:paintTemptation, R:paintContemplation, doors:paintPassion },
  byline:['hiERONYMUS bOSCH', 'tRiPTYCH, oiL oN oAK, c.1500', 'mUSEU nACiONAL dE aRTE aNTiGA, lISBOA'],
  labels:{ L:'tHE fLiGHT aND tHE fALL', C:'tHE tEMPTATiON', R:'iN cONTEMPLATiON', closed:'tHE aRREST · tHE wAY tO cALVARY' },
  scroll:[ 'lEFT: dEViLS cARRY aNTHONY tHROUGH tHE aiR, hiS bROTHERS hELP hiM oVER tHE bRiDGE',
           'cENTRE: tHE sAiNT kNEELS aT tHE rUiNED cHAPEL wHiLE a vILLAGE bURNS aND dEViLS hOLD tHEiR mASS',
           'rIGHT: aNTHONY rEADS, uNMOVED bY tHE fEAST aND tHE qUEEN iN tHE tREE',
           'cLOSED, iN gRiSAiLLE: cHRiST iS tAKEN iN tHE gARDEN aND lED tO cALVARY',
           'oiL oN oAK, c.1500, mUSEU nACiONAL dE aRTE aNTiGA, lISBOA' ],
  glitter:{ C:30 },
  step:function(){ villageFire.step(); villageSmoke.step(); lute.step(); },
  draw:{
    C:function(){ villageSmoke.draw(); villageFire.draw(); drawShip(); drawWater(); lute.draw(); },
    L:function(){ drawFlight(); drawSkate(); },
    R:function(){ drawFishFly(); drawWaiters(); },
    closed:drawClosedA
  }
});
})();
