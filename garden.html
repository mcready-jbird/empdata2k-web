    rect(x,y-4,1,4,s); rect(x+1,y-4,1,4,d); P(x,y-5,s); P(x+1,y-5,s); P(x,y-6,hair); P(x+1,y-6,hair); P(x,y-5,hair);

var bathers=[];
(function(){ var R=RNG(5); for (var i=0;i<12;i++){ var a=R()*6.28, d=Math.sqrt(R())*0.75; bathers.push({x:Math.round(POOL.x+Math.cos(a)*d*POOL.rx), y:Math.round(POOL.y+Math.sin(a)*d*POOL.ry), ph:R()*6.28, hair:['h','H','1','h','2'][i%5], hat: i%4===1 ? 'bird' : i%4===3 ? 'cherry' : null}); } })();
function drawBathers(){

    if (b.hat==='cherry'){ dp(x,y-3,K.r); dp(x+1,y-3,K.z); dp(x,y-4,K.r); dp(x+1,y-5,K.d); }

}
var FLYERS=[

  { spr:[mkSpr(24,18,function(){ egg(8,13,6,2.6,['T','S','s']); ball(15,10,2.4,['T','S','s']); line(17,10,19,11,'N'); P(15,9,'0'); path([6,12, 8,6, 12,4],'n'); line(7,11,10,5,'t'); line(3,14,0,16,'S'); line(3,15,2,17,'S'); line(10,15,10,17,'S'); sitterR(8,10); }),
         mkSpr(24,18,function(){ egg(8,13,6,2.6,['T','S','s']); ball(15,10,2.4,['T','S','s']); line(17,10,19,11,'N'); P(15,9,'0'); path([6,13, 9,15, 13,16],'n'); line(7,14,11,16,'t'); line(3,14,0,16,'S'); line(4,15,4,17,'S'); line(11,15,12,17,'S'); sitterR(8,10); })],
    y:26, sp:0.22, x:120 },
  { spr:[mkSpr(22,22,function(){ egg(11,6,4,2,['2','3']); P(15,5,'y'); P(16,6,'y'); path([8,5, 5,2, 1,1],'2'); path([14,5, 17,2, 21,1],'2'); nude(10,20,1,1,'f','H',true); }),
         mkSpr(22,22,function(){ egg(11,6,4,2,['2','3']); P(15,5,'y'); P(16,6,'y'); path([8,6, 5,8, 1,9],'2'); path([14,6, 17,8, 21,9],'2'); nude(10,20,1,1,'f','H',true); })],

function sitterR(x,y){ rect(x,y-4,1,4,'f'); rect(x+1,y-4,1,4,'F'); P(x,y-5,'f'); P(x+1,y-5,'f'); P(x,y-6,'h'); P(x+1,y-6,'h'); P(x+1,y+1,'F'); rect(x-1,y-8,1,4,'f'); }
function drawFlyers(){
  for (var i=0;i<FLYERS.length;i++){

var swim=[]; for (var sw=0;sw<7;sw++) swim.push({a:sw*0.9, r:24+sw*4, ph:Math.random()*6});
function drawSwimmers(){
  for (var i=0;i<swim.length;i++){
    var s=swim[i], a=s.a+tick*0.004*(i&1?1:-1), x=PC.x+112+Math.cos(a)*s.r*2.4, y=PC.y+97+Math.sin(a)*3;

    if ((tick+i*5)%16<8){ dp(x-1,y,K.a); } else dp(x+2,y,K.a);
  }
}
var wavers=[]; (function(){ var R=RNG(9); for (var i=0;i<16;i++) wavers.push({x:10+Math.floor(R()*204), y:170+Math.floor(R()*64), ph:Math.floor(R()*20), sk:R()<0.15?'q':'f', h:R()<0.3?'H':'h'}); })();
function drawWavers(){
  for (var i=0;i<wavers.length;i++){
    var w=wavers[i], up=((tick+w.ph)%24)<12, x=PC.x+w.x, y=PC.y+w.y, s=K[w.sk], d=w.sk==='q'?K.N:K.F;

/* --- hell --- */
var fires=[], notes=[], souls=[];
var FIRE_SRC=[[8,56],[30,56],[46,56],[63,56],[77,56],[98,56],[8,77],[100,85],[16,135],[96,131],[52,185],[6,235],[104,199]];
function updateHell(){
  for (var i=0;i<5;i++){
    var s=FIRE_SRC[Math.floor(Math.random()*FIRE_SRC.length)], big=s[1]<60;
    fires.push({x:s[0]+(Math.random()-0.5)*(big?7:3), y:s[1], vx:(Math.random()-0.5)*0.3, vy:-(big?0.9:0.5)-Math.random()*0.7, life:0, max:(big?14:7)+Math.random()*10});
  }
  for (var j=fires.length-1;j>=0;j--){ var f=fires[j]; f.x+=f.vx; f.y+=f.vy; f.vy*=0.97; if (++f.life>=f.max) fires.splice(j,1); }
  if (tick%14===0){ var h=Math.random()<0.5; notes.push({x:h?18:36, y:h?176:198, life:0, ch:Math.random()<0.5?'♪':'♫'}); }
  for (var n=notes.length-1;n>=0;n--){ var nt=notes[n]; nt.y-=0.35; nt.x+=Math.sin((nt.life+n)*0.2)*0.4; if (++nt.life>60) notes.splice(n,1); }
  if (tick%18===0) souls.push({x:84+Math.random()*4-2, y:210, vy:0});
  for (var q=souls.length-1;q>=0;q--){ var so=souls[q]; so.vy+=0.12; so.y+=so.vy; if (so.y>231) souls.splice(q,1); }
}
function drawFire(){
  for (var i=0;i<fires.length;i++){
    var p=fires[i], f=p.life/p.max, x=Math.round(PR.x+p.x), y=Math.round(PR.y+p.y);
    if (x<PR.x||x>=PR.x+PR.iw||y<PR.y) continue;
    var chr = f<0.35 ? '▓' : f<0.7 ? '▒' : '░';
    var col = f<0.15 ? C(15) : f<0.4 ? C(14) : f<0.65 ? C(12) : f<0.85 ? C(4) : C(8);
    dglyph(y>>1, x, chr, col);
  }
}
function drawBeams(){
  var src=[[24,20],[70,44]];
  for (var b=0;b<2;b++){
    var a=-Math.PI/2 + Math.sin(tick*0.012+b*2.1)*0.55, dx=Math.cos(a), dy=Math.sin(a);
    for (var d=4; d<70; d+=1.4){
      var x=Math.round(PR.x+src[b][0]+dx*d), y=Math.round(PR.y+src[b][1]+dy*d*1.0);
      if (y<PR.y||x<PR.x||x>=PR.x+PR.iw) break;
      if (((d*3)|0)%2) dglyph(y>>1, x, '░', K.s);
    }
  }
}
function ear(cx,cy){
  egg(cx,cy,5.5,9,['q','F','f','k']);

  ell(cx+1.4,cy+2,2.2,4,'q'); P(cx+1,cy+3,'N');

var EARS = mkSpr(46,28,function(){

  lier(6,22,-1,'f','h'); lier(22,24,1,'f','1');
});

var SKATER = mkSpr(14,13,function(){ line(1,12,12,12,'7'); path([12,12, 13,11, 13,10],'7'); rect(4,10,4,2,'n'); nude(5,9,0,1,'f','h'); P(4,4,'f'); P(3,3,'f'); P(8,4,'F'); P(9,3,'F'); poly([4,-1, 7,-1, 6,-4],'2'); });

var RABBITH=[0,1].map(function(fr){ return mkSpr(24,20,function(){

}); });
var hunter={x:44,dir:1};
function drawHunter(){
  if (tick%2===0) hunter.x+=hunter.dir*0.25; if (hunter.x>62) hunter.dir=-1; if (hunter.x<36) hunter.dir=1;
  dspr(RABBITH[(tick>>2)&1], PR.x+hunter.x-12, PR.y+166, hunter.dir<0);

function drawPrince(){
  var kick=(tick>>2)&1;
  dp(PR.x+97,PR.y+181,K.f); dp(PR.x+98,PR.y+181-kick,K.f); dp(PR.x+99,PR.y+180-kick,K.F);
  dp(PR.x+97,PR.y+182,K.F); dp(PR.x+98,PR.y+183+kick,K.F); dp(PR.x+99,PR.y+184+kick,K.f);
  for (var i=0;i<souls.length;i++){ var s=souls[i]; dp(PR.x+s.x,PR.y+s.y,K.f); dp(PR.x+s.x,PR.y+s.y+1,K.F); dp(PR.x+s.x+1,PR.y+s.y+1,K.f); }

function drawNotes(){
  for (var i=0;i<notes.length;i++){ var n=notes[i]; var f=n.life/60; dglyph(Math.round(PR.y+n.y)>>1, Math.round(PR.x+n.x), n.ch, f<0.5?K.s:(f<0.8?K['6']:K.I)); }

/* --- closed shutters --- */
function drawClosed(){
  var an=tick*0.02, r=104, cx=PC.c0+PL.w, cy=TOP*2+122;
