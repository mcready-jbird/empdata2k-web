function drawBox(g,b){
  var W=cw,H=ch, lw=Math.max(1,Math.round(W/8));

  var dbl = b.u===2||b.d===2||b.l===2||b.r===2;
  if (!dbl){
    var x0=cx-Math.floor(lw/2), y0=cy-Math.floor(lw/2);
    if (b.l) g.fillRect(0,y0,x0+lw,lw);
    if (b.r) g.fillRect(x0,y0,W-x0,lw);
    if (b.u) g.fillRect(x0,0,lw,y0+lw);
    if (b.d) g.fillRect(x0,y0,lw,H-y0);
    return;

  var Ty=cy-Math.floor(lw/2)-lw, By=cy-Math.floor(lw/2)+lw;
  var Lx=cx-Math.floor(lw/2)-lw, Rx=cx-Math.floor(lw/2)+lw;
  function Hl(y,xa,xb){ g.fillRect(xa,y,xb-xa,lw); }
  function Vl(x,ya,yb){ g.fillRect(x,ya,lw,yb-ya); }
  var L=b.l,R=b.r,U=b.u,D=b.d;
  if (L&&R&&!U&&!D){ Hl(Ty,0,W); Hl(By,0,W); return; }
  if (U&&D&&!L&&!R){ Vl(Lx,0,H); Vl(Rx,0,H); return; }
  if (R&&D&&!L&&!U){ Hl(Ty,Lx,W); Vl(Lx,Ty,H); Hl(By,Rx,W); Vl(Rx,By,H); return; }
  if (L&&D&&!R&&!U){ Hl(Ty,0,Rx+lw); Vl(Rx,Ty,H); Hl(By,0,Lx+lw); Vl(Lx,By,H); return; }
  if (U&&R&&!L&&!D){ Hl(By,Lx,W); Vl(Lx,0,By+lw); Hl(Ty,Rx,W); Vl(Rx,0,Ty+lw); return; }
  if (U&&L&&!R&&!D){ Hl(By,0,Rx+lw); Vl(Rx,0,By+lw); Hl(Ty,0,Lx+lw); Vl(Lx,0,Ty+lw); return; }
  if (U&&D&&R&&!L){ Vl(Lx,0,H); Vl(Rx,0,Ty+lw); Vl(Rx,By,H); Hl(Ty,Rx,W); Hl(By,Rx,W); return; }
  if (U&&D&&L&&!R){ Vl(Rx,0,H); Vl(Lx,0,Ty+lw); Vl(Lx,By,H); Hl(Ty,0,Lx+lw); Hl(By,0,Lx+lw); return; }
  if (L&&R&&D&&!U){ Hl(Ty,0,W); Hl(By,0,Lx+lw); Hl(By,Rx,W); Vl(Lx,By,H); Vl(Rx,By,H); return; }

  Vl(Lx,0,Ty+lw); Vl(Lx,By,H); Vl(Rx,0,Ty+lw); Vl(Rx,By,H);
}

function drawGlyph(g,chr){

    case '░': case '▒': case '▓': shade(g,chr); return;

  g.font = fontPx+'px '+FONT;

  g.fillText(chr, W/2, H/2+1);

  g.fillStyle=fg;

    var c2 = 6+Math.floor(Math.random()*(COLS-12));
    spawnKnight({x:c2, dir:Math.random()<0.5?1:-1, under:true, wasInside:insideCols(c2)});
  }
}
function spawnEdgeKnight(){
  var left = Math.random()<0.5;
  spawnKnight({x: left?-3:COLS+2, dir: left?1:-1});
}
function killKnight(k,burnt){ k.state='dead'; k.deadT=0; k.burnt=burnt; k.target=null; }
function startJump(k,vy0,jvx){ k.state='jump'; k.vy=-vy0; k.jvx=jvx; }

// stand row (feet) available at column c for knight k coming from column fromCol
function standAt(c,k,fromCol){
  if (insideCols(c)){
    var top = SURF[c]-1;
    if (k.fy <= top+2.5) return top;                          // on the letters (steps up to 2 rows)
    if (!insideCols(fromCol) && k.under!==true) return top;   // wall of letters ahead
    return GROUND_ROW-1;
  }
  return GROUND_ROW-1;
}

function updateKnight(k){
  if (k.state==='dead'){ if (++k.deadT>36) k.remove=true; return; }
  if (k.flash>0) k.flash--;
  if (k.state==='victory'){ if (--k.timer<=0) k.state='run'; return; }

  if (k.state==='jump'){
    var fromCol = Math.round(k.x);
    k.vy += G; k.fy += k.vy; k.x += k.dir*k.jvx;
    var col = Math.round(k.x);
    var s = standAt(col,k,fromCol);
    if (k.fy >= s){
      var prevFy = k.fy - k.vy;
      if (prevFy <= s+0.6){ k.fy=s; k.vy=0; k.state='run'; }
      else {
        k.x -= k.dir*k.jvx;                       // hit a wall side
        if (k.vy>0){ var s2 = standAt(Math.round(k.x),k,fromCol); if (k.fy>=s2){ k.fy=s2; k.vy=0; k.state='run'; } }
      }
    }
    if (k.x<-5||k.x>COLS+4) k.remove=true;
    return;
  }

  // fight detection (grounded knights on the same level)
  var best=null, bd=99;
  for (var i=0;i<knights.length;i++){
    var o=knights[i];
    if (o===k||o.team===k.team||o.state==='dead'||o.state==='jump') continue;
    var dx=Math.abs(o.x-k.x);
    if (Math.abs(o.fy-k.fy)<=1 && dx<=3.2 && dx<bd){ best=o; bd=dx; }
  }
  if (best){
    if (k.state!=='fight'){ k.state='fight'; k.atk=0; k.atkT=4+Math.floor(Math.random()*8); }
    k.target=best; k.dir = best.x>=k.x?1:-1;
  } else if (k.state==='fight'){ k.state='run'; k.target=null; }

  if (k.state==='fight'){
    if (--k.atkT<=0){
      if (k.atk===0){ k.atk=1; k.atkT=4; }
      else if (k.atk===1){
        var t=k.target;
        if (t && t.state!=='dead' && Math.abs(t.x-k.x)<=3.5 && Math.random()<0.5){
          t.hp--; t.flash=2; sparks.push({x:Math.round(t.x), y:Math.round(t.fy)-1, t:3});
          if (t.hp<=0){ killKnight(t,false); k.state='victory'; k.timer=16; k.atk=0; k.target=null; return; }
        }
        k.atk=2; k.atkT=5;
      } else { k.atk=0; k.atkT=8+Math.floor(Math.random()*12); }
    }
    return;
  }

  // running
  k.anim++;
  var col0 = Math.round(k.x);
  var inside = insideCols(col0);
  if (k.wasInside && !inside) k.under=null;
  k.wasInside = inside;
  if (Math.random()<0.003){ k.dir=-k.dir; k.under=null; }

  // look ahead for walls -> jump
  for (var d=1; d<=6; d++){
    var sc = col0 + k.dir*d;
    var sa = standAt(sc,k,col0);
    if (sa < k.fy-2){
      if (!inside && insideCols(sc) && k.under===null){ k.under = Math.random()<0.35; return; }
      var h = k.fy - sa;
      if (h > 14){ k.dir=-k.dir; k.under=null; break; }
      var vy0 = Math.sqrt(2*G*(h+1.5));
      var tA = vy0/G;
      var need = (d+0.5)/tA;
      if (need <= 0.9){ startJump(k, vy0, Math.max(0.35,need)); return; }
      break;
    }
    if (sa !== k.fy) break;
  }

  var nx = k.x + k.dir*0.5;
  var ncol = Math.round(nx);
  var st = standAt(ncol,k,col0);
  if (st < k.fy){
    if (k.fy-st <= 2){ k.x=nx; k.fy=st; } else { k.dir=-k.dir; k.under=null; }
  } else if (st > k.fy){
    if (st-k.fy <= 2){ k.x=nx; k.fy=st; }
    else {
      var rnd=Math.random();
      if (rnd<0.6){ k.dir=-k.dir; }
      else if (rnd<0.8){ startJump(k,1.3,0.6); }
      else { k.x=nx; startJump(k,0,0.5); }
    }
  } else k.x=nx;
  if (k.x<-5||k.x>COLS+4) k.remove=true;
}

function knightColor(k,chr,r){
  if (k.state==='dead') return k.burnt ? (k.deadT<10 ? C(6) : C(8)) : C(8);
  if (k.flash>0) return C(15);
  if (chr==='Θ') return C(15);
  if (chr==='▐'||chr==='▌') return k.team ? C(9) : C(12);
  if (chr==='█') return C(7);
  if (r===2) return C(7);
  return C(15);
}

function drawKnight(k){
  var frame;
  if (k.state==='dead') frame='dead';
  else if (k.state==='jump') frame='jump';
  else if (k.state==='victory') frame='windup';
  else if (k.state==='fight') frame = k.atk===1 ? 'windup' : k.atk===2 ? 'thrust' : 'run0';
  else frame = ((k.anim>>1)&1) ? 'run1' : 'run0';
  var rows = (k.dir>0 ? KN_R : KN_L)[frame];
  var x0 = Math.round(k.x) - (k.dir>0 ? 1 : 2);
  var y0 = Math.round(k.fy) - 2;
  for (var r=0;r<3;r++) for (var c=0;c<4;c++){
    var chr=rows[r][c]; if (chr===' ') continue;
    putCell(ctx, y0+r, x0+c, chr, knightColor(k,chr,r), null, true);
  }
}

// clicking anywhere in the top block (header bar down to the footer bar) summons a
// knight: a ring and a burst of sparks, then it pops up out of the nearest black spot.
var FIELD_TOP = 3, FIELD_BOT = GROUND_ROW-1;   // rows the knights may be spawned on
var BLOCK_BOT = GROUND_ROW+2;                  // last row that still counts as a click
var HARDK = 60;                                // sanity cap for very eager clicking
var puffs = [], rings = [];
function spawnBurst(x,y,col){
  rings.push({ x:x, y:y, t:0, col:col });
  for (var i=0;i<18;i++){
    var a = i/18*6.283 + Math.random()*0.3, sp = 0.4+Math.random()*0.8;
    puffs.push({ x:x, y:y, vx:Math.cos(a)*sp*1.7, vy:Math.sin(a)*sp*0.85, life:0, max:9+Math.random()*9, col:col });
  }
}
function updateBurst(){
  for (var i=puffs.length-1;i>=0;i--){
    var p=puffs[i]; p.life++; p.x+=p.vx; p.y+=p.vy; p.vx*=0.85; p.vy=p.vy*0.85+0.035;
    if (p.life>=p.max) puffs.splice(i,1);
  }
  for (var j=rings.length-1;j>=0;j--) if (++rings[j].t>6) rings.splice(j,1);
}
function drawBurst(){
  for (var j=0;j<rings.length;j++){
    var g=rings[j], rr=0.8+g.t*1.5, chr = g.t<2 ? '▓' : g.t<4 ? '▒' : '░';
    for (var a=0;a<26;a++){
      var an=a/26*6.283;
      putCell(ctx, Math.round(g.y+Math.sin(an)*rr*0.5), Math.round(g.x+Math.cos(an)*rr), chr, g.col, null, false);
    }
  }
  for (var i=0;i<puffs.length;i++){
    var p=puffs[i], f=p.life/p.max;
    var pc = f<0.3 ? '*' : f<0.6 ? '+' : '·';
    putCell(ctx, Math.round(p.y), Math.round(p.x), pc, p.col, null, false);
  }
}
// the whole 3x4 sprite has to fit in empty cells: no letters, no frames
function roomFor(r,c){
  if (r-2 < FIELD_TOP || r > FIELD_BOT) return false;
  for (var y=r-2; y<=r; y++) for (var x=Math.max(0,c-2); x<=Math.min(COLS-1,c+1); x++)
    if (SCREEN[y][x].ch !== ' ') return false;
  return true;
}
// nearest such spot to the clicked cell; rows weigh double, a cell is twice as tall as wide
function freeSpot(r,c){
  var best=null, bd=1e9;
  for (var y=FIELD_TOP+2; y<=FIELD_BOT; y++) for (var x=0; x<COLS; x++){
    var d = (x-c)*(x-c) + 4*(y-r)*(y-r);
    if (d<bd && roomFor(y,x)){ bd=d; best={ r:y, c:x }; }
  }
  return best;
}
function onBlock(r,c){ return r>=0 && r<=BLOCK_BOT && c>=0 && c<COLS; }
function cellAt(ev){
  var b=canvas.getBoundingClientRect();
  return { c: Math.floor((ev.clientX-b.left)/(cw/dpr)), r: Math.floor((ev.clientY-b.top)/(ch/dpr)) };
}
var popTeam = Math.random()<0.5 ? 0 : 1;                   // the colour the next popped knight gets
function popKnight(r,c){
  var spot = freeSpot(r,c); if (!spot) return;
  var team = popTeam; popTeam = 1-popTeam;                 // red and blue take turns
  spawnBurst(spot.c, spot.r-1, team ? C(9) : C(12));       // burst in the new knight's colour
  if (knights.length >= HARDK) return;
  spawnKnight({ x:spot.c, fy:spot.r, team:team, dir:Math.random()<0.5?1:-1,
                state:'jump', vy:-1.0, jvx:0.3, wasInside:insideCols(spot.c) });
}
canvas.addEventListener('pointerdown', function(ev){
  if (ev.button>0) return;
  var p=cellAt(ev); if (!onBlock(p.r,p.c)) return;
  popKnight(p.r,p.c);
});
canvas.addEventListener('mousemove', function(ev){
  var p=cellAt(ev); canvas.style.cursor = onBlock(p.r,p.c) ? 'pointer' : '';
});

function merge(base,ov){
  return base.map(function(row,i){
    var o=ov[i]; if (!o) return row;
    return row.split('').map(function(ch,j){ return o[j] && o[j]!=='.' ? o[j] : ch; }).join('');
  });

function pixToCells(rows,pal){
  pal = pal || DCOL;
  var h=rows.length/2, w=rows[0].length, out=[];
  for (var r=0;r<h;r++){
    var row=[];
    for (var c=0;c<w;c++){
      var t=rows[2*r][c], b=rows[2*r+1][c], T=t!=='.', B=b!=='.';
      if (!T&&!B) row.push(null);
      else if (T&&B) row.push(t===b ? {ch:'█',fg:pal[t],bg:null} : {ch:'▀',fg:pal[t],bg:pal[b]});
      else if (T) row.push({ch:'▀',fg:pal[t],bg:null});
      else row.push({ch:'▄',fg:pal[b],bg:null});
    }
    out.push(row);
  }
  return out;
}

  dragon.t++;
  dragon.x += dragon.dir*0.6;
  var ty = dragon.alt + Math.sin(dragon.t*0.11)*(dragon.low?0.6:1.0);
  dragon.y += (ty-dragon.y)*0.08;
  var mouthCol = dragon.dir>0 ? dragon.x+DW : dragon.x-1;
  var overLogo = mouthCol > LOGO_LEFT-10 && mouthCol < LOGO_LEFT+LOGO_W+10;
  if (dragon.low) dragon.breathing = overLogo && (dragon.t%44)<24;

  }
  if ((dragon.dir>0 && dragon.x>COLS+3) || (dragon.dir<0 && dragon.x<-DW-3)) dragon.wait = 40+Math.floor(Math.random()*80);
}

/* ---------------------------- main loop --------------------------- */
function step(){
  tick++;
  if (tick%36===0 && knights.length<MAXK) spawnEdgeKnight();
  for (var i=0;i<knights.length;i++) updateKnight(knights[i]);
  for (var j=knights.length-1;j>=0;j--) if (knights[j].remove) knights.splice(j,1);
  updateDragon();
  updateFire();
  updateBurst();
}
function render(){
  ctx.drawImage(sCanvas,0,0);
  drawStars();
  drawHeat();
  for (var i=0;i<knights.length;i++) drawKnight(knights[i]);
  drawSparks();
  drawBurst();
  drawFire();
  drawDragon();
  drawIcons();
  drawProjects();
  drawScroller();
}

var TICK_MS = 50, acc=0, last=0;
function frame(now){
  if (!last) last=now;
  acc += Math.min(now-last, 250); last=now;
  var n=0;
  while (acc>=TICK_MS && n<5){ step(); acc-=TICK_MS; n++; }
  if (n>0) render();
  requestAnimationFrame(frame);
}

if (/[?&]pop(=|&|$)/.test(qs)) for (var pk=0; pk<3; pk++) popKnight(LOGO_TOP+3+pk*3, LOGO_LEFT+10+pk*24);
var qT = /[?&]t=(\d+)/.exec(qs);
if (qT){ for (var ff=0; ff<Math.min(+qT[1],5000); ff++){ step(); if (qLow){ dragon.low=true; dragon.alt=7; } } }
render();
requestAnimationFrame(frame);
})();
