/* ========================= moving things ========================== */
// paradise: the rebel angels keep tumbling out of heaven, the serpent flicks its tongue
var fallers=[]; for (var fi=0;fi<34;fi++) fallers.push({x:20+Math.random()*50, y:Math.random()*56+40, vx:(Math.random()-0.5)*0.3, sp:0.3+Math.random()*0.5, k:Math.random()*4|0});
function updateFallers(){ for (var i=0;i<fallers.length;i++){ var f=fallers[i]; f.y+=f.sp; f.x+=f.vx+Math.sin((tick+i*7)*0.15)*0.4; if (f.y>96){ f.y=40; f.x=26+Math.random()*40; } } }
function drawFallers(){
  for (var i=0;i<fallers.length;i++){
    var f=fallers[i], x=Math.round(PL.x+f.x), y=Math.round(PL.y+f.y), up=((tick>>1)+f.k)&1;
    if (f.x<1||f.x>PL.iw-2) continue;
    dp(x,y,K['2']); dp(x-1,y-up,K['3']); dp(x+1,y-up,K['3']); dp(x,y+1,K['1']);
  }
  if ((tick%40)<6){ dp(PL.x+53,PL.y+136,K.r); dp(PL.x+54,PL.y+137,K.r); }
  if ((tick%70)<3) dglyph((PL.y+204)>>1, PL.x+49, '☼', K['9']);
}
// the haywain: the wheels turn, the devils pull, people climb the ladders, christ's glory
// shimmers, the musicians play and wisps of hay drift down
function drawWheels(){
  for (var w=0;w<WHEELS.length;w++){
    var wh=WHEELS[w], cx=PC.x+wh[0], cy=PC.y+wh[1], r=wh[2]-1.5;
    for (var s=0;s<4;s++){ var a=s*Math.PI/4+tick*0.04; dline(cx-Math.cos(a)*r, cy-Math.sin(a)*r, cx+Math.cos(a)*r, cy+Math.sin(a)*r, K.n); }
    dp(cx,cy,K.t);
  }
}
function pullerSpr(kind,fr){
  return mkSpr(18,20,function(){
    var body={fish:['x','w'], rat:['4','5'], tree:['N','n'], stag:['n','t']}[kind];
    if (kind==='tree'){ line(6,19,8,13,'N'); line(10,19,9,13,'N'); if (fr){ P(5,19,'N'); P(11,19,'N'); } else { P(7,19,'N'); P(10,18,'N'); } }
    else if (fr){ line(7,13,5,19,body[0]); line(9,13,11,19,body[1]); } else { line(7,13,7,19,body[0]); line(9,13,9,19,body[1]); }
    limb(7,7,8,13,2,body[0]); line(9,8,9,12,body[1]);
    limb(9,8,14,6,0.8,body[1]); P(15,6,'f');
    if (kind==='fish'){ egg(11,4,4,2.2,['x','w','W']); P(14,3,'0'); P(15,5,'R'); poly([7,4, 5,1, 5,7],'w'); }
    else if (kind==='rat'){ egg(11,4,3.4,2,['4','5','6']); P(14,5,'k'); P(12,3,'0'); P(10,1,'k'); P(11,1,'k'); path([6,12, 3,14, 2,17],'k'); }
    else if (kind==='tree'){ ball(10,4,3,['D','d','g']); line(8,6,5,2,'N'); line(12,6,15,1,'N'); P(10,5,'y'); }
    else { ball(11,4,2.2,['n','t']); P(13,4,'0'); path([10,2, 9,0, 8,0],'N'); path([12,2, 13,0, 15,0],'N'); P(14,5,'N'); }
  });
}
var PULLERS=[['fish',164,188],['rat',174,196],['tree',164,198],['stag',176,187]].map(function(p,i){ return { x:p[1], y:p[2], k:i, spr:[pullerSpr(p[0],0),pullerSpr(p[0],1)] }; });
function drawPullers(){
  var list=PULLERS.slice().sort(function(a,b){ return a.y-b.y; });
  for (var i=0;i<list.length;i++){ var p=list[i], fr=((tick>>2)+p.k)&1, sp=p.spr[fr]; dspr(sp, PC.x+p.x-9, PC.y+p.y-19-fr, false); }
}
var CLIMB_COL=['r','B','o','g','e','P'];

}
var wisps=[];
function updateWisps(){
  if (Math.random()<0.4){ var side=Math.random()<0.5?-1:1; wisps.push({x:HAY.x+side*(HAY.rx*0.6+Math.random()*HAY.rx*0.35), y:HAY.y-10+Math.random()*40, vx:side*0.15, life:0}); }
  for (var i=wisps.length-1;i>=0;i--){ var w=wisps[i]; w.x+=w.vx+Math.sin((w.life+i)*0.3)*0.2; w.y+=0.35; if (++w.life>70||w.y>200) wisps.splice(i,1); }
}
function drawWisps(){ for (var i=0;i<wisps.length;i++){ var w=wisps[i]; dp(PC.x+w.x,PC.y+w.y,i&1?K.s:K.S); dp(PC.x+w.x+1,PC.y+w.y+(i&1),K.S); } }
function drawGlory(){

// shut: the dog snaps, the dancers hop, crows circle the gallows
function drawClosedH(){
  var ox=PC.c0, oy=TOP*2, open=(tick>>2)&1;
  if (open){ dp(ox+71,oy+211,K.R); dp(ox+72,oy+212,K['9']); dp(ox+71,oy+212,K.n); }
  var hop=(tick>>3)&1;
  var dancers=[[124,152,'r'],[132,153,'B'],[140,152,'o']];
  for (var d=0;d<dancers.length;d++){ var D=dancers[d], y=oy+D[1]-((hop+d)&1); for (var j=0;j<7;j++){ dp(ox+D[0],y-j,K[D[2]]); dp(ox+D[0]+1,y-j,K[D[2]]); } dp(ox+D[0],y-8,K.f); dp(ox+D[0]+1,y-8,K.f); dp(ox+D[0],y-9,K.h); dp(ox+D[0]+1,y-9,K.h); dp(ox+D[0]+((hop+d)&1?-1:2),y-9,K.f); }
  for (var c=0;c<3;c++){ var a=tick*0.04+c*2.1, x=Math.round(ox+160+Math.cos(a)*16), y=Math.round(oy+74+Math.sin(a)*5); dglyph(y>>1, x, (tick>>2)&1?'v':'^', K['1']); }
}
